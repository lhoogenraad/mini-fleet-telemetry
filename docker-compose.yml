version: "3.9"

services:
  telemetry-api:
    build:
      context: ./services/telemetry-api
      dockerfile: Dockerfile
    container_name: telemetry-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=telemetry;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
    depends_on:
      - postgres
    restart: unless-stopped

  telemetry-simulator:
    build:
      context: ./services/telemetry-simulator
      dockerfile: Dockerfile
    container_name: telemetry-simulator
    environment:
      TELEMETRY_API_URL: http://telemetry-api:8080
      DEVICE_COUNT: 25
      EMIT_INTERVAL_MS: 2000
    depends_on:
      - telemetry-api
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: telemetry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: telemetry-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
