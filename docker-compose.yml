version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: telemetry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: telemetry-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  telemetry-api:
    depends_on:
      - postgres
      - redis
    build:
      context: .
      dockerfile: services/telemetry-api/Dockerfile
    container_name: telemetry-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=telemetry;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
    restart: unless-stopped

  telemetry-worker:
    build:
      context: .
      dockerfile: services/telemetry-worker/Dockerfile
    container_name: telemetry-worker
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  device-input:
    build:
      context: ./services/device-input
      dockerfile: Dockerfile
    container_name: device-input
    environment:
      TELEMETRY_API_URL: http://telemetry-api:8080
      DEVICE_COUNT: 25
      EMIT_INTERVAL_MS: 2000
    depends_on:
      - telemetry-api
    restart: unless-stopped

  telemetry-grpc-worker:
    build:
      context: .
      dockerfile: services/telemetry-grpc-worker/Dockerfile
    container_name: telemetry-grpc-worker
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres-data:
